<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>植物図鑑</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jsqr/1.4.0/jsQR.js"></script>
<style>
  :root {
    --bg-success: #e6f4ea;
    --text-success: #2e7d4f;
    --border-success: #a8d5b8;
    --surface-1: #f7f7f5;
    --surface-2: #ffffff;
    --border: #e3e2df;
    --border-strong: #c9c8c3;
    --text-primary: #1f1f1d;
    --text-secondary: #6b6a66;
    --text-muted: #9c9b96;
    --text-accent: #6a5acd;
    --text-danger: #c0392b;
    --bg-accent-muted: #efecfb;
    --fill-primary: #2e7d4f;
    --on-primary: #ffffff;
    --fill-danger: #e74c3c;
    --on-danger: #ffffff;
    --fill-field: #ffffff;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-sans); background: var(--surface-1); color: var(--text-primary);
    max-width: 480px; margin-left: auto; margin-right: auto; padding: 16px; padding-bottom: 60px;
  }
  button {
    font-family: var(--font-sans); border-radius: var(--radius); border: 0.5px solid var(--border-strong);
    background: var(--surface-2); color: var(--text-primary); cursor: pointer; font-size: 14px;
  }
  button:active { opacity: 0.8; }
  input, select, textarea {
    font-family: var(--font-sans); border-radius: var(--radius); border: 0.5px solid var(--border);
    background: var(--fill-field); color: var(--text-primary); font-size: 14px; padding: 8px 10px; height: 40px;
  }
  textarea { height: auto; }
  select { height: 40px; }
  img { max-width: 100%; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; }
</style>
</head>
<body>
<h2 class="sr-only">植物の記録・図鑑アプリ</h2>
<div id="app"></div>

<script>
let plants = [];
let classList = [];
let genusList = [];
let view = { screen: 'list', plantId: null, mode: 'all', query: '', sortBy: 'name' };
let pendingPhotos = [];
let pendingLogPhotos = [];
let scanStream = null;
let scanRAF = null;
let cal = { mode: 'log', year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };

// --- storage: uses localStorage so data persists in this browser ---
const storage = {
  async get(key) { const v = localStorage.getItem(key); return v === null ? null : { value: v }; },
  async set(key, value) { localStorage.setItem(key, value); return { key, value }; }
};

async function loadAll() {
  try { const r = await storage.get('plants-data'); plants = r ? JSON.parse(r.value) : []; } catch(e) { plants = []; }
  // 管理番号リセット: 分類・属リストを空にしてから登録済み植物の登場順で振り直す
  classList = [];
  genusList = [];
  rebuildListsFromPlants();
  renumberAll();
  await savePlants(); await saveClassList(); await saveGenusList();
  render();
}
async function savePlants() { try { await storage.set('plants-data', JSON.stringify(plants)); } catch(e){} }
async function saveClassList() { try { await storage.set('class-list', JSON.stringify(classList)); } catch(e){} }
async function saveGenusList() { try { await storage.set('genus-list', JSON.stringify(genusList)); } catch(e){} }

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n,len){ return String(n).padStart(len,'0'); }
function fmtDate(iso){ if(!iso) return '未設定'; const d=new Date(iso); return d.getFullYear()+'/'+pad(d.getMonth()+1,2)+'/'+pad(d.getDate(),2); }
function daysSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function latestLogDate(p){ const logs=p.logs||[]; if(!logs.length) return p.addedDate||''; return logs.reduce((m,l)=> l.date>m?l.date:m, logs[0].date); }
function purchaseLineText(p){
  const parts = [];
  if (p.addedDate) parts.push('from '+fmtDate(p.addedDate));
  if (p.purchaseLocation) parts.push(p.purchaseLocation);
  return parts.join(' ');
}
function titleLineText(p){ return [p.classification, p.genus, p.name].filter(Boolean).join(' '); }
function classGenusText(p){ return [p.classification, p.genus].filter(Boolean).join(' '); }

function hashHue(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))%360; } return h; }
function tagColor(t){ const hue=hashHue(t); return { bg:'hsl('+hue+', 65%, 93%)', fg:'hsl('+hue+', 55%, 32%)' }; }
function tagChipHtml(t, extra){ const c=tagColor(t); return '<span '+(extra||'')+' style="font-size:12px; background:'+c.bg+'; color:'+c.fg+'; padding:3px 8px; border-radius:var(--radius); display:inline-block;">#'+escapeHtml(t)+'</span>'; }

function formatManagementNumber(ci, gi, seq){ return pad(ci+1,2)+'-'+pad(gi+1,2)+'-'+pad(seq,3); }
function genManagementNumber(classification, genus){
  let ci=classList.indexOf(classification); if(ci<0) ci=classList.length;
  let gi=genusList.indexOf(genus); if(gi<0) gi=genusList.length;
  const seq=plants.filter(p=>p.classification===classification && p.genus===genus).length+1;
  return formatManagementNumber(ci, gi, seq);
}
function rebuildListsFromPlants(){
  if (classList.length === 0) {
    const seen = []; plants.forEach(p => { if (p.classification && !seen.includes(p.classification)) seen.push(p.classification); });
    classList = seen;
  }
  if (genusList.length === 0) {
    const seen = []; plants.forEach(p => { if (p.genus && !seen.includes(p.genus)) seen.push(p.genus); });
    genusList = seen;
  }
}
function renumberAll(){
  const counts = {};
  plants.forEach(p => {
    const key = p.classification+'|'+p.genus;
    counts[key] = (counts[key]||0)+1;
    const ci = classList.indexOf(p.classification);
    const gi = genusList.indexOf(p.genus);
    p.managementNumber = formatManagementNumber(ci<0?classList.length:ci, gi<0?genusList.length:gi, counts[key]);
  });
}

function allTags(){ const s=new Set(); plants.forEach(p=>(p.hashtags||[]).forEach(t=>s.add(t))); return Array.from(s); }
function usedClassifications(){ const s=new Set(); plants.forEach(p=>{ if(p.classification) s.add(p.classification); }); return Array.from(s); }
function matchesQuery(p,q){
  if(!q) return true;
  const needle=q.toLowerCase().replace(/^#/,'');
  if(p.name.toLowerCase().includes(needle)) return true;
  if((p.classification||'').toLowerCase().includes(needle)) return true;
  if((p.genus||'').toLowerCase().includes(needle)) return true;
  if((p.managementNumber||'').toLowerCase().includes(needle)) return true;
  if((p.purchaseLocation||'').toLowerCase().includes(needle)) return true;
  if((p.eventInfo||'').toLowerCase().includes(needle)) return true;
  if((p.hashtags||[]).some(t=>t.toLowerCase().includes(needle))) return true;
  return false;
}
function sortPlants(arr){
  const a = arr.slice();
  if (view.sortBy === 'addedDate') return a.sort((x,y)=> {
    if(!x.addedDate && !y.addedDate) return 0;
    if(!x.addedDate) return 1;
    if(!y.addedDate) return -1;
    return new Date(y.addedDate)-new Date(x.addedDate);
  });
  if (view.sortBy === 'lastLog') return a.sort((x,y)=> new Date(latestLogDate(y)||0)-new Date(latestLogDate(x)||0));
  return a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));
}

function logsOnDate(dateStr){
  const out = [];
  plants.forEach(p => (p.logs||[]).forEach(l => { if (l.date === dateStr) out.push({ p, l }); }));
  return out;
}
function acquiredOnDate(dateStr){
  return plants.filter(p => p.addedDate === dateStr);
}
function datesWithLogsInMonth(year, month){
  const s = new Set();
  plants.forEach(p => (p.logs||[]).forEach(l => {
    const d = new Date(l.date);
    if (d.getFullYear()===year && d.getMonth()===month) s.add(l.date);
  }));
  return s;
}
function datesAcquiredInMonth(year, month){
  const s = new Set();
  plants.forEach(p => { if (p.addedDate) { const d = new Date(p.addedDate); if (d.getFullYear()===year && d.getMonth()===month) s.add(p.addedDate); } });
  return s;
}
function monthSummary(year, month){
  let newCount = 0, logCount = 0;
  plants.forEach(p => {
    if (p.addedDate) { const d = new Date(p.addedDate); if (d.getFullYear()===year && d.getMonth()===month) newCount++; }
    (p.logs||[]).forEach(l => { const d = new Date(l.date); if (d.getFullYear()===year && d.getMonth()===month) logCount++; });
  });
  return { newCount, logCount };
}

function render() {
  const app = document.getElementById('app');
  stopScan();
  if (view.screen === 'list') { app.innerHTML = renderList(); bindListEvents(); }
  else if (view.screen === 'add') { app.innerHTML = renderForm(null); bindFormEvents(null); }
  else if (view.screen === 'edit') { app.innerHTML = renderForm(view.plantId); bindFormEvents(view.plantId); }
  else if (view.screen === 'detail') { app.innerHTML = renderDetail(view.plantId); bindDetailEvents(); }
  else if (view.screen === 'logAdd') { app.innerHTML = renderLogForm(view.plantId); bindLogEvents(); }
  else if (view.screen === 'scan') { app.innerHTML = renderScan(); bindScanEvents(); }
  else if (view.screen === 'calendar') { app.innerHTML = renderCalendar(); bindCalendarEvents(); }
}

function pillBtn(key, label, active) {
  return '<button class="mode-btn" data-key="'+escapeHtml(key)+'" style="flex-shrink:0; height:30px; padding:0 12px; font-size:13px; white-space:nowrap; ' +
    (active ? 'background:var(--bg-success); color:var(--text-success); border:0.5px solid var(--border-success);' : '') + '">'+escapeHtml(label)+'</button>';
}

function plantCard(p) {
  const thumb = (p.photos && p.photos[0]) ? p.photos[0] : null;
  let html = '<div class="plant-card" data-id="'+p.id+'" style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:12px; padding:0.7rem 1rem; display:flex; align-items:center; gap:12px; cursor:pointer; min-width:0;">';
  if (thumb) html += '<img src="'+thumb+'" style="width:44px; height:44px; border-radius:10px; object-fit:cover; flex-shrink:0; align-self:flex-start;" />';
  else html += '<div style="width:44px; height:44px; border-radius:10px; background:var(--bg-success); display:flex; align-items:center; justify-content:center; flex-shrink:0; align-self:flex-start;"><i class="ti ti-plant" style="font-size:20px; color:var(--text-success);" aria-hidden="true"></i></div>';
  html += '<div style="flex:1; min-width:0;">';
  html += '<p style="font-weight:500; font-size:15px; margin:0; overflow-wrap:break-word;">'+escapeHtml(titleLineText(p))+'</p>';
  const purchaseLine = purchaseLineText(p);
  html += '<p style="font-size:12px; color:var(--text-secondary); margin:2px 0 0; overflow-wrap:break-word;">'+escapeHtml(p.managementNumber)+(purchaseLine?(' ・ '+escapeHtml(purchaseLine)):'')+'</p>';
  if ((p.hashtags||[]).length) html += '<p style="margin:4px 0 0; display:flex; gap:4px; flex-wrap:wrap;">'+p.hashtags.map(t=>tagChipHtml(t)).join('')+'</p>';
  html += '</div><i class="ti ti-chevron-right" style="font-size:18px; color:var(--text-muted); flex-shrink:0;" aria-hidden="true"></i></div>';
  return html;
}

function emptyState(msg) {
  return '<div style="text-align:center; padding:2.5rem 1rem; color:var(--text-secondary);">' +
    '<i class="ti ti-seeding" style="font-size:32px; display:block; margin-bottom:12px; color:var(--text-muted);" aria-hidden="true"></i>' +
    '<p style="font-size:14px; margin:0;">'+escapeHtml(msg)+'</p></div>';
}

function renderList() {
  let html = '';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.85rem;">';
  html += '<h3 style="margin:0; font-size:18px; font-weight:500;">植物図鑑</h3>';
  html += '<div style="display:flex; gap:6px;">';
  html += '<button id="cal-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-calendar" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button id="scan-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-qrcode" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button id="add-btn" style="display:flex; align-items:center; gap:6px; padding:0 14px; height:36px;"><i class="ti ti-plus" style="font-size:18px;" aria-hidden="true"></i>追加</button>';
  html += '</div></div>';

  html += '<div style="position:relative; margin-bottom:0.6rem;">';
  html += '<i class="ti ti-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>';
  html += '<input id="search-input" type="text" placeholder="名前・#タグ・分類で検索" value="'+escapeHtml(view.query)+'" style="width:100%; padding-left:34px;" />';
  html += '</div>';

  html += '<div style="display:flex; align-items:center; justify-content:flex-end; gap:6px; margin-bottom:0.75rem;">';
  html += '<span style="font-size:12px; color:var(--text-muted);">並び替え</span>';
  html += '<select id="sort-select" style="height:30px; font-size:12px; padding:0 8px;">';
  html += '<option value="name" '+(view.sortBy==='name'?'selected':'')+'>名前順</option>';
  html += '<option value="addedDate" '+(view.sortBy==='addedDate'?'selected':'')+'>お迎え日順</option>';
  html += '<option value="lastLog" '+(view.sortBy==='lastLog'?'selected':'')+'>記録が新しい順</option>';
  html += '</select></div>';

  html += '<div style="display:flex; gap:6px; overflow-x:auto; padding-bottom:8px; margin-bottom:0.75rem;">';
  html += pillBtn('all', 'すべて', view.mode === 'all');
  html += pillBtn('tag', 'ハッシュタグ別', view.mode === 'tag');
  html += pillBtn('class', '分類別', view.mode === 'class');
  html += '</div>';

  const q = view.query.trim();

  if (view.mode === 'all') {
    const filtered = sortPlants(plants.filter(p => matchesQuery(p, q)));
    if (filtered.length === 0) html += emptyState('該当する植物がありません');
    else { html += '<div style="display:flex; flex-direction:column; gap:10px;">'; filtered.forEach(p => { html += plantCard(p); }); html += '</div>'; }
  } else if (view.mode === 'tag') {
    const tags = allTags(); let any = false;
    tags.forEach(t => {
      const group = sortPlants(plants.filter(p => (p.hashtags||[]).includes(t) && matchesQuery(p, q)));
      if (group.length === 0) return; any = true;
      const c = tagColor(t);
      html += '<p style="font-size:13px; font-weight:600; color:'+c.fg+'; margin:0.9rem 0 8px;">#'+escapeHtml(t)+'</p>';
      html += '<div style="display:flex; flex-direction:column; gap:10px;">'; group.forEach(p => { html += plantCard(p); }); html += '</div>';
    });
    if (!any) html += emptyState('該当する植物がありません');
  } else if (view.mode === 'class') {
    const classes = usedClassifications(); let any = false;
    classes.forEach(c => {
      const group = sortPlants(plants.filter(p => p.classification === c && matchesQuery(p, q)));
      if (group.length === 0) return; any = true;
      html += '<p style="font-size:13px; font-weight:500; color:var(--text-accent); margin:0.9rem 0 8px;">'+escapeHtml(c)+'</p>';
      html += '<div style="display:flex; flex-direction:column; gap:10px;">'; group.forEach(p => { html += plantCard(p); }); html += '</div>';
    });
    if (!any) html += emptyState('該当する植物がありません');
  }
  return html;
}

function bindListEvents() {
  document.getElementById('add-btn').onclick = () => { pendingPhotos=[]; view = { screen:'add', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('scan-btn').onclick = () => { view = { screen:'scan', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('cal-btn').onclick = () => { cal.selected = null; view = { screen:'calendar', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  const searchInput = document.getElementById('search-input');
  searchInput.oninput = () => { view.query = searchInput.value; render(); const si=document.getElementById('search-input'); si.focus(); si.setSelectionRange(view.query.length, view.query.length); };
  document.getElementById('sort-select').onchange = (e) => { view.sortBy = e.target.value; render(); };
  document.querySelectorAll('.mode-btn').forEach(b => { b.onclick = () => { view.mode = b.dataset.key; render(); }; });
  document.querySelectorAll('.plant-card').forEach(el => { el.onclick = () => { view = { screen:'detail', plantId: el.dataset.id, mode: view.mode, query: view.query, sortBy: view.sortBy }; render(); }; });
}

function renderCalendar() {
  let html = '';
  html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:1rem;">';
  html += '<button id="back-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-arrow-left" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<h3 style="margin:0; font-size:18px; font-weight:500;">カレンダー</h3></div>';

  html += '<div style="display:flex; gap:6px; margin-bottom:1rem;">';
  html += pillBtn('cal-log', '成長記録', cal.mode==='log');
  html += pillBtn('cal-acquire', '入手日', cal.mode==='acquire');
  html += '</div>';

  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.75rem;">';
  html += '<button id="cal-prev" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-chevron-left" style="font-size:16px;" aria-hidden="true"></i></button>';
  html += '<p style="margin:0; font-size:15px; font-weight:500;">'+cal.year+'年 '+(cal.month+1)+'月</p>';
  html += '<button id="cal-next" style="width:32px; height:32px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-chevron-right" style="font-size:16px;" aria-hidden="true"></i></button>';
  html += '</div>';

  const summary = monthSummary(cal.year, cal.month);
  html += '<div style="display:flex; gap:8px; margin-bottom:1rem;">';
  html += '<div style="flex:1; background:var(--bg-accent-muted); border-radius:var(--radius); padding:8px 10px; text-align:center;">';
  html += '<p style="margin:0; font-size:11px; color:var(--text-accent);">新規登録</p>';
  html += '<p style="margin:2px 0 0; font-size:16px; font-weight:600; color:var(--text-accent);">'+summary.newCount+'<span style="font-size:11px; font-weight:400;">件</span></p></div>';
  html += '<div style="flex:1; background:var(--bg-success); border-radius:var(--radius); padding:8px 10px; text-align:center;">';
  html += '<p style="margin:0; font-size:11px; color:var(--text-success);">成長記録</p>';
  html += '<p style="margin:2px 0 0; font-size:16px; font-weight:600; color:var(--text-success);">'+summary.logCount+'<span style="font-size:11px; font-weight:400;">件</span></p></div>';
  html += '</div>';

  const markedDates = cal.mode === 'log' ? datesWithLogsInMonth(cal.year, cal.month) : datesAcquiredInMonth(cal.year, cal.month);
  const firstDay = new Date(cal.year, cal.month, 1);
  const startOffset = firstDay.getDay();
  const daysInMonth = new Date(cal.year, cal.month+1, 0).getDate();
  const todayStr = new Date().toISOString().slice(0,10);

  html += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:0.5rem;">';
  ['日','月','火','水','木','金','土'].forEach(d => { html += '<div style="text-align:center; font-size:11px; color:var(--text-muted);">'+d+'</div>'; });
  html += '</div>';

  html += '<div style="display:grid; grid-template-columns:repeat(7,1fr); gap:4px; margin-bottom:1.25rem;">';
  for (let i=0; i<startOffset; i++) html += '<div></div>';
  for (let day=1; day<=daysInMonth; day++) {
    const dateStr = cal.year+'-'+pad(cal.month+1,2)+'-'+pad(day,2);
    const marked = markedDates.has(dateStr);
    const isToday = dateStr === todayStr;
    const isSelected = cal.selected === dateStr;
    html += '<button class="cal-day" data-date="'+dateStr+'" style="aspect-ratio:1; padding:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; ' +
      (isSelected ? 'background:var(--bg-success); border:1px solid var(--border-success);' : (isToday ? 'border:1px solid var(--border-strong);' : 'border:0.5px solid var(--border);')) +
      '"><span style="font-size:12px; '+(isSelected?'color:var(--text-success); font-weight:600;':'')+'">'+day+'</span>' +
      (marked ? '<span style="width:5px; height:5px; border-radius:50%; background:'+(cal.mode==='log'?'var(--text-success)':'var(--text-accent)')+';"></span>' : '<span style="width:5px; height:5px;"></span>') +
      '</button>';
  }
  html += '</div>';

  if (cal.selected) {
    const label = cal.mode === 'log' ? '成長記録' : '入手日';
    html += '<p style="margin:0 0 8px; font-size:13px; font-weight:500; color:var(--text-secondary);">'+escapeHtml(fmtDate(cal.selected))+'の'+label+'</p>';
    if (cal.mode === 'log') {
      const entries = logsOnDate(cal.selected);
      if (entries.length === 0) html += '<p style="font-size:13px; color:var(--text-muted); text-align:center; padding:1rem 0;">この日の記録はありません</p>';
      else {
        html += '<div style="display:flex; flex-direction:column; gap:8px;">';
        entries.forEach(({p,l}) => {
          html += '<div class="cal-entry" data-id="'+p.id+'" style="background:var(--surface-2); border:0.5px solid var(--border); border-radius:var(--radius); padding:10px 12px; cursor:pointer;">';
          html += '<p style="margin:0; font-size:13px; font-weight:500;">'+escapeHtml(titleLineText(p))+'</p>';

  html += '<h3 style="margin:0; font-size:18px; font-weight:500;">QRコードを読み取る</h3></div>';
  html += '<div style="position:relative; width:100%; aspect-ratio:1; background:#000; border-radius:12px; overflow:hidden;">';
  html += '<video id="scan-video" playsinline style="width:100%; height:100%; object-fit:cover;"></video>';
  html += '</div>';
  html += '<p id="scan-status" style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:12px;">ラベルのQRコードを枠内に映してください</p>';

function stopScan() {
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

async function bindScanEvents() {
  document.getElementById('back-btn').onclick = () => { view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  const video = document.getElementById('scan-video');
  const statusEl = document.getElementById('scan-status');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const tick = () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);
        if (code && code.data) {
          const text = code.data;
          const found = plants.find(p => text.includes(p.managementNumber));
          if (found) {
            stopScan();
            view = { screen:'detail', plantId: found.id, mode:view.mode, query:view.query, sortBy:view.sortBy };
            render();
            return;
          } else {
            statusEl.textContent = '一致する植物が見つかりません';
          }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  } catch (e) {
    statusEl.textContent = 'カメラを利用できません。ブラウザの設定でカメラへのアクセスを許可してください。';
  }
}

function resizeImage(file, maxW) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  unsetCheckbox.onchange = () => { dateInput.disabled = unsetCheckbox.checked; };

  document.getElementById('save-btn').onclick = async () => {
    const errEl = document.getElementById('f-error');
    const name = document.getElementById('f-name').value.trim();
    let classification = document.getElementById('f-class').value;
    if (classification === '__new__') classification = document.getElementById('f-class-new').value.trim();
    let genus = document.getElementById('f-genus').value;

    if (!classList.includes(classification)) { classList.push(classification); await saveClassList(); }
    if (!genusList.includes(genus)) { genusList.push(genus); await saveGenusList(); }

      p.purchaseLocation=purchaseLocation; p.eventInfo=eventInfo;

      await savePlants();
      view = { screen:'detail', plantId: editId, mode: view.mode, query: view.query, sortBy: view.sortBy };

      plants.push(newPlant);

    html += '<div style="display:flex; flex-direction:column; gap:8px;">';
    logs.forEach(l => {
      html += '<div style="background:var(--surface-1); border-radius:var(--radius); padding:10px 12px;">';
      html += '<div style="display:flex; justify-content:space-between; align-items:baseline;"><span style="font-size:12px; color:var(--text-secondary);">'+fmtDate(l.date)+'</span></div>';
      if ((l.photos||[]).length) {
        html += '<div style="display:flex; gap:6px; overflow-x:auto; margin:6px 0;">';
        l.photos.forEach(src => { html += '<img src="'+src+'" style="width:64px; height:64px; object-fit:cover; border-radius:8px; flex-shrink:0;" />'; });
        html += '</div>';
      }
      if (l.note) html += '<p style="margin:4px 0 0; font-size:13px; line-height:1.5; overflow-wrap:break-word;">'+escapeHtml(l.note)+'</p>';
      html += '</div>';
    });
    html += '</div>';
  }
  return html;
}

function bindDetailEvents() {
  const p = plants.find(x=>x.id===view.plantId);
  document.getElementById('back-btn').onclick = () => { view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('edit-btn').onclick = () => { view = { screen:'edit', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('del-btn').onclick = async () => {
    plants = plants.filter(x=>x.id!==p.id); renumberAll(); await savePlants();
    view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render();
  };
  document.getElementById('log-add-btn').onclick = () => { pendingLogPhotos=[]; view = { screen:'logAdd', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };

  new QRCode(document.getElementById('qr-code'), { text: p.managementNumber+' '+p.name, width: 120, height: 120 });

  function wrapLines(ctx, text, maxWidth) {
    const lines = []; let cur = '';
    for (const ch of text) {
      const test = cur + ch;
      if (ctx.measureText(test).width > maxWidth && cur) { lines.push(cur); cur = ch; } else { cur = test; }
    }
    if (cur) lines.push(cur);
    return lines.length ? lines : [''];
  }

  document.getElementById('label-download-btn').onclick = () => {
    const qrImg = document.querySelector('#qr-code img, #qr-code canvas');
    const measureCanvas = document.createElement('canvas');
    const mctx = measureCanvas.getContext('2d');
    const canvasWidth = 480;
    const qrSize = 150;
    const qrPad = 24;
    const textX = qrPad + qrSize + 28;
    const textMaxWidth = canvasWidth - textX - 20;

    const cgFont = '400 14px sans-serif', cgLH = 18;
    const nameFont = '700 24px sans-serif', nameLH = 29;
    const mnFont = '400 14px sans-serif', mnLH = 18;
    const plFont = '400 13px sans-serif', plLH = 17;

    mctx.font = cgFont; const cgLines = classGenusText(p) ? wrapLines(mctx, classGenusText(p), textMaxWidth) : [];
    mctx.font = nameFont; const nameLines = wrapLines(mctx, p.name, textMaxWidth);
    mctx.font = mnFont; const mnLines = wrapLines(mctx, p.managementNumber, textMaxWidth);
    const pLineText = purchaseLineText(p);
    mctx.font = plFont; const plLines = pLineText ? wrapLines(mctx, pLineText, textMaxWidth) : [];

    const blockGap = 10;
    let textBlockHeight = 0;
    if (cgLines.length) textBlockHeight += cgLines.length*cgLH + blockGap;
    textBlockHeight += nameLines.length*nameLH + blockGap;
    textBlockHeight += mnLines.length*mnLH;
    if (plLines.length) textBlockHeight += blockGap*0.6 + plLines.length*plLH;

    const canvasHeight = Math.max(qrSize + qrPad*2, textBlockHeight + 40);
    const canvas = document.createElement('canvas');
    canvas.width = canvasWidth; canvas.height = Math.round(canvasHeight);
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height);

    const draw = () => {
      const qrY = Math.round((canvas.height - qrSize)/2);
      ctx.drawImage(qrImg, qrPad, qrY, qrSize, qrSize);
      ctx.fillStyle = '#000000';
      let y = Math.round((canvas.height - textBlockHeight)/2) + 14;
      if (cgLines.length) {
        ctx.font = cgFont; ctx.fillStyle = '#6b6a66';
        cgLines.forEach(line => { ctx.fillText(line, textX, y); y += cgLH; });
        y += blockGap - (cgLH - 14);
        ctx.fillStyle = '#000000';
      }
      ctx.font = nameFont;
      nameLines.forEach(line => { ctx.fillText(line, textX, y); y += nameLH; });
      y += blockGap - (nameLH - 14);
      ctx.font = mnFont; ctx.fillStyle = '#6b6a66';
      mnLines.forEach(line => { ctx.fillText(line, textX, y); y += mnLH; });
      if (plLines.length) {
        y += blockGap*0.6 - (mnLH-14);
        ctx.font = plFont;
        plLines.forEach(line => { ctx.fillText(line, textX, y); y += plLH; });
      }
      canvas.toBlob((blob) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'label_'+p.managementNumber+'.png'; a.click(); URL.revokeObjectURL(url); });
    };
    if (qrImg.tagName === 'IMG' && !qrImg.complete) { qrImg.onload = draw; } else { draw(); }
  };

  document.getElementById('label-print-btn').onclick = () => {
    const qrImg = document.querySelector('#qr-code img, #qr-code canvas');
    const src = qrImg.tagName === 'IMG' ? qrImg.src : qrImg.toDataURL();
    const area = document.getElementById('label-print-area');
    const pLine = purchaseLineText(p);
    area.innerHTML = '<style>@media print { body * { visibility: hidden; } #print-label, #print-label * { visibility: visible; } #print-label { position: absolute; top:0; left:0; width:70mm; min-height:24mm; display:flex; align-items:flex-start; gap:4mm; padding:2mm; box-sizing:border-box; } #print-label .txt { max-width:44mm; } }</style>' +
      '<div id="print-label"><img src="'+src+'" style="width:18mm; height:18mm; flex-shrink:0;" /><div class="txt" style="font-family:sans-serif; overflow-wrap:break-word;">' +
      '<div style="font-size:8px; color:#333;">'+escapeHtml(classGenusText(p))+'</div>' +
      '<div style="font-size:10px; font-weight:bold;">'+escapeHtml(p.name)+'</div>' +
      '<div style="font-size:8px;">'+escapeHtml(p.managementNumber)+'</div>' +
      (pLine ? '<div style="font-size:7px;">'+escapeHtml(pLine)+'</div>' : '') +
      '</div></div>';
    window.print();
  };
}

function renderLogForm(plantId) {
  const p = plants.find(x=>x.id===plantId);
  let html = '';
  html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">';
  html += '<button id="back-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-arrow-left" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<h3 style="margin:0; font-size:18px; font-weight:500; flex:1; min-width:0; overflow-wrap:break-word;">'+escapeHtml(p?p.name:'')+' の記録</h3></div>';
  html += '<label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">写真</label>';
  html += renderPhotoPicker(pendingLogPhotos, 'log-');
  html += '<label style="font-size:13px; color:var(--text-secondary); display:block; margin:1rem 0 6px;">メモ</label>';
  html += '<textarea id="l-note" rows="3" placeholder="新しい葉が出た、植え替えたなど" style="width:100%; margin-bottom:1.25rem; padding:8px; font-family:var(--font-sans); font-size:14px; border-radius:var(--radius); border:0.5px solid var(--border); background:var(--fill-field);"></textarea>';
  html += '<p id="l-error" style="display:none; color:var(--text-danger); font-size:13px; margin:0 0 12px;"></p>';
  html += '<button id="l-save-btn" style="width:100%; height:40px; background:var(--fill-primary); color:var(--on-primary); border:none;">記録を保存</button>';
  return html;
}
function bindLogEvents() {
  document.getElementById('back-btn').onclick = () => { view = { screen:'detail', plantId:view.plantId, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  bindPhotoPicker(pendingLogPhotos, 'log-', refreshLogPhotoGrid);
  document.getElementById('l-save-btn').onclick = async () => {
    const errEl = document.getElementById('l-error');
    const note = document.getElementById('l-note').value.trim();
    if (!note && pendingLogPhotos.length === 0) { errEl.textContent='写真かメモのどちらかを入力してください'; errEl.style.display='block'; return; }
    errEl.style.display = 'none';
    const p = plants.find(x=>x.id===view.plantId);
    if (!p.logs) p.logs = [];
    p.logs.push({ id: uid(), date: new Date().toISOString().slice(0,10), note, photos: pendingLogPhotos.slice() });
    await savePlants();
    view = { screen:'detail', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy };
    render();
  };
}

loadAll();
</script>
