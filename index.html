<html lang="ja">
<head>
<meta charset="UTF-8" />

<style>
  :root {
    --bg-success: #e6f4ea;
    --text-success: #2e7d4f;
    --border-success: #a8d5b8;
    --surface-1: #f7f7f5;
    --surface-2: #ffffff;
    --border: #e3e2df;
    --border-strong: #c9c8c3;
    --text-primary: #1f1f1d;
    --text-secondary: #6b6a66;
    --text-muted: #9c9b96;
    --text-accent: #6a5acd;
    --text-danger: #c0392b;
    --bg-accent-muted: #efecfb;
    --fill-primary: #2e7d4f;
    --on-primary: #ffffff;
    --fill-danger: #e74c3c;
    --on-danger: #ffffff;
    --fill-field: #ffffff;
    --radius: 8px;
    --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Kaku Gothic ProN", "Noto Sans JP", sans-serif;

  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: var(--font-sans); background: var(--surface-1); color: var(--text-primary);
    max-width: 480px; margin-left: auto; margin-right: auto; padding: 16px; padding-bottom: 60px;
  }
  button {
    font-family: var(--font-sans); border-radius: var(--radius); border: 0.5px solid var(--border-strong);

  button:active { opacity: 0.8; }
  input, select, textarea {
    font-family: var(--font-sans); border-radius: var(--radius); border: 0.5px solid var(--border);
    background: var(--fill-field); color: var(--text-primary); font-size: 14px; padding: 8px 10px; height: 40px;

  textarea { height: auto; }

  img { max-width: 100%; }
  .app-btn { border-radius: 12px !important; }
  .app-card { border-radius: 16px !important; box-shadow: 0 1px 2px rgba(0,0,0,0.04); }
  .app-select { -webkit-appearance: menulist; appearance: menulist; border-radius: 12px; border: 0.5px solid var(--border); background: var(--surface-2); }
  .app-input { border-radius: 12px; border: 0.5px solid var(--border); background: var(--surface-2); }

<body>
<h2 class="sr-only">植物の記録・図鑑アプリ</h2>
<div id="app"></div>

<script>
// ↓↓↓ Google Cloud Console で発行した OAuth クライアントIDに書き換えてください ↓↓↓
const GOOGLE_CLIENT_ID = '727777082286-86e06u0vola7be7ir7oabo6lc7937l1k.apps.googleusercontent.com';
const GDRIVE_BACKUP_FILENAME = 'plant-tracker-backup.json';

let plants = [];
let genusList = [];
let view = { screen: 'list', plantId: null, mode: 'all', query: '', sortBy: 'name' };
let pendingPhotos = [];
let pendingLogPhotos = [];
let scanStream = null;
let scanRAF = null;
let cal = { mode: 'log', year: new Date().getFullYear(), month: new Date().getMonth(), selected: null };
let calJumpOpen = false;
let infoExpanded = true;
let qrExpanded = false;
let logsExpanded = false;
let tagHistoryExpanded = false;
let expandedGroups = new Set();
let tagAddOpenFor = null;
let timelineViewerIndex = null;
let photoBrowseIndex = 0;
let taxonomyEditing = null;
let taxonomyEditError = null;
let taxonomyDeleteConfirm = null;
let gdriveTokenClient = null;
let gdriveAccessToken = null;
let gdriveStatus = 'idle';
let gdriveMessage = '';
let gdriveLastSync = null;

// --- storage: uses localStorage so data persists in this browser ---
const storage = {
  async get(key) { const v = localStorage.getItem(key); return v === null ? null : { value: v }; },
  async set(key, value) { localStorage.setItem(key, value); return { key, value }; }
};

async function loadAll() {
  try { const r = await storage.get('plants-data'); plants = r ? JSON.parse(r.value) : []; } catch(e) { plants = []; }
  try { const r = await storage.get('genus-list'); if (r) genusList = JSON.parse(r.value); } catch(e) {}
  try { const r = await storage.get('gdrive-last-sync'); if (r) gdriveLastSync = r.value; } catch(e) {}
  rebuildListsFromPlants();
  renumberAll();
  await savePlants(); await saveGenusList();
  const hashMatch = location.hash.match(/[#&]p=([A-Za-z0-9_-]+)/);
  if (hashMatch) {
    const target = plants.find(p => p.id === decodeURIComponent(hashMatch[1]));
    if (target) view = { screen:'detail', plantId: target.id, mode:'all', query:'', sortBy:'name' };
  }
  render();
}
async function savePlants() { try { await storage.set('plants-data', JSON.stringify(plants)); } catch(e){} scheduleGdriveAutoBackup(); }
async function saveGenusList() { try { await storage.set('genus-list', JSON.stringify(genusList)); } catch(e){} }

// --- Google Drive backup/restore (uses drive.file scope: app can only see files it created) ---
let gdriveAutoSyncTimer = null;

function gdriveEnsureTokenClient() {
  if (gdriveTokenClient) return gdriveTokenClient;
  if (!window.google || !google.accounts || !google.accounts.oauth2) return null;
  gdriveTokenClient = google.accounts.oauth2.initTokenClient({
    client_id: GOOGLE_CLIENT_ID,
    scope: 'https://www.googleapis.com/auth/drive.file',
    callback: (resp) => {
      if (resp && resp.access_token) {
        gdriveAccessToken = resp.access_token;
        gdriveMessage = 'Googleアカウントに接続しました';
        storage.set('gdrive-connected', '1');
        gdriveMaybeOfferRestore();
      } else {
        gdriveMessage = '接続に失敗しました';
      }
      render();
    }
  });
  return gdriveTokenClient;
}

// If a request comes back unauthorized (expired/revoked token), drop the token so the
// UI goes back to "未接続" and the person can reconnect with one tap. We deliberately do
// NOT retry this silently — a script-initiated (non-click) token request gets flagged by
// the browser as an unsolicited popup, which is worse than just asking to tap "接続" again.
function gdriveHandleAuthError(status) {
  if (status === 401) {
    gdriveAccessToken = null;
    gdriveMessage = '接続が切れました。もう一度「接続」を押してください';
  }
}

function gdriveConnect() {
  if (!GOOGLE_CLIENT_ID || GOOGLE_CLIENT_ID.indexOf('YOUR_') === 0) {
    gdriveMessage = '先にコード内の GOOGLE_CLIENT_ID を設定してください';
    render();
    return;
  }
  const client = gdriveEnsureTokenClient();
  if (!client) {
    gdriveMessage = 'Google連携の読み込みに失敗しました。時間をおいて再読み込みしてください';
    render();
    return;
  }
  client.requestAccessToken();
}

function gdriveDisconnect() {
  gdriveAccessToken = null;
  gdriveMessage = '接続を解除しました';
  storage.set('gdrive-connected', '0');
  render();
}

async function gdriveFindBackupFile() {
  const q = "name='" + GDRIVE_BACKUP_FILENAME + "' and trashed=false";
  const url = 'https://www.googleapis.com/drive/v3/files?q=' + encodeURIComponent(q) + '&fields=files(id,modifiedTime)&spaces=drive';
  const res = await fetch(url, { headers: { 'Authorization': 'Bearer ' + gdriveAccessToken } });
  if (!res.ok) { gdriveHandleAuthError(res.status); throw new Error('検索に失敗しました (' + res.status + ')'); }
  const data = await res.json();
  return (data.files && data.files[0]) || null;
}

async function gdriveCreateFile(contentStr) {
  const boundary = 'plant_tracker_boundary';
  const delimiter = '\r\n--' + boundary + '\r\n';
  const closeDelim = '\r\n--' + boundary + '--';
  const metadata = { name: GDRIVE_BACKUP_FILENAME, mimeType: 'application/json' };
  const body = delimiter +
    'Content-Type: application/json; charset=UTF-8\r\n\r\n' + JSON.stringify(metadata) +
    delimiter +
    'Content-Type: application/json\r\n\r\n' + contentStr +
    closeDelim;
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id', {
    method: 'POST',
    headers: { 'Authorization': 'Bearer ' + gdriveAccessToken, 'Content-Type': 'multipart/related; boundary="' + boundary + '"' },
    body: body
  });
  if (!res.ok) { gdriveHandleAuthError(res.status); throw new Error('作成に失敗しました (' + res.status + ')'); }
  return await res.json();
}

async function gdriveUpdateFile(fileId, contentStr) {
  const res = await fetch('https://www.googleapis.com/upload/drive/v3/files/' + fileId + '?uploadType=media', {
    method: 'PATCH',
    headers: { 'Authorization': 'Bearer ' + gdriveAccessToken, 'Content-Type': 'application/json' },
    body: contentStr
  });
  if (!res.ok) { gdriveHandleAuthError(res.status); throw new Error('更新に失敗しました (' + res.status + ')'); }
  return await res.json();
}

async function gdriveDownloadFile(fileId) {
  const res = await fetch('https://www.googleapis.com/drive/v3/files/' + fileId + '?alt=media', {
    headers: { 'Authorization': 'Bearer ' + gdriveAccessToken }
  });
  if (!res.ok) { gdriveHandleAuthError(res.status); throw new Error('ダウンロードに失敗しました (' + res.status + ')'); }
  return await res.text();
}

async function gdriveBackup() {
  if (!gdriveAccessToken) { gdriveMessage = 'まずGoogleアカウントに接続してください'; render(); return; }
  gdriveStatus = 'syncing'; gdriveMessage = 'バックアップ中...'; render();
  try {
    await gdriveDoBackup();
    gdriveMessage = 'バックアップが完了しました';
  } catch (e) {
    gdriveMessage = 'バックアップに失敗しました: ' + e.message;
  }
  gdriveStatus = 'idle';
  render();
}

// Shared upload logic used by both the manual button and the silent auto-backup.
async function gdriveDoBackup() {
  const payload = JSON.stringify({ plants, genusList, savedAt: new Date().toISOString() });
  const existing = await gdriveFindBackupFile();
  if (existing) { await gdriveUpdateFile(existing.id, payload); }
  else { await gdriveCreateFile(payload); }
  gdriveLastSync = new Date().toISOString();
  await storage.set('gdrive-last-sync', gdriveLastSync);
}

// Called automatically after any change to plants data (see savePlants). Debounced so a
// burst of edits results in one upload, and silent (no dialogs, no re-render) so it
// never interrupts whatever the person is doing — e.g. typing in a field.
function scheduleGdriveAutoBackup() {
  if (!gdriveAccessToken) return;
  clearTimeout(gdriveAutoSyncTimer);
  gdriveAutoSyncTimer = setTimeout(() => {
    gdriveDoBackup().catch((e) => console.warn('Googleドライブへの自動バックアップに失敗しました', e));
  }, 2500);
}

// After connecting (manually or silently on load), check whether Drive already has a
// newer backup than what's on this device — e.g. changes made on another device — and
// offer to pull it in.
async function gdriveMaybeOfferRestore() {
  if (!gdriveAccessToken) return;
  try {
    const existing = await gdriveFindBackupFile();
    if (!existing || !existing.modifiedTime) return;
    const remoteTime = new Date(existing.modifiedTime).getTime();
    const localTime = gdriveLastSync ? new Date(gdriveLastSync).getTime() : 0;
    if (remoteTime > localTime + 5000) {
      if (window.confirm('Googleドライブに、この端末より新しいバックアップがあります。復元しますか？')) {
        await gdriveRestore(true);
      }
    }
  } catch(e) { console.warn(e); }
}

async function gdriveRestore(skipConfirm) {
  if (!gdriveAccessToken) { gdriveMessage = 'まずGoogleアカウントに接続してください'; render(); return; }
  if (!skipConfirm && !window.confirm('Googleドライブのバックアップで、この端末のデータを上書きします。よろしいですか？')) return;
  gdriveStatus = 'syncing'; gdriveMessage = '復元中...'; render();
  try {
    const existing = await gdriveFindBackupFile();
    if (!existing) {
      gdriveMessage = 'バックアップファイルが見つかりませんでした';
      gdriveStatus = 'idle'; render(); return;
    }
    const text = await gdriveDownloadFile(existing.id);
    const data = JSON.parse(text);
    plants = data.plants || [];
    genusList = data.genusList || [];
    await storage.set('plants-data', JSON.stringify(plants));
    await saveGenusList();
    gdriveLastSync = new Date().toISOString();
    await storage.set('gdrive-last-sync', gdriveLastSync);
    gdriveMessage = '復元が完了しました';
    view = { screen:'list', plantId:null, mode:'all', query:'', sortBy:'name' };
  } catch (e) {
    gdriveMessage = '復元に失敗しました: ' + e.message;
  }
  gdriveStatus = 'idle';
  render();
}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function pad(n,len){ return String(n).padStart(len,'0'); }
function fmtDate(iso){ if(!iso) return '未設定'; const d=new Date(iso); return d.getFullYear()+'/'+pad(d.getMonth()+1,2)+'/'+pad(d.getDate(),2); }
function daysSince(iso){ return Math.floor((Date.now()-new Date(iso).getTime())/86400000); }
function escapeHtml(str){ const d=document.createElement('div'); d.textContent=str||''; return d.innerHTML; }
function latestLogDate(p){ const logs=p.logs||[]; if(!logs.length) return p.addedDate||''; return logs.reduce((m,l)=> l.date>m?l.date:m, logs[0].date); }
function purchaseLineText(p){
  const parts = [];
  if (p.addedDate) parts.push('from '+fmtDate(p.addedDate));
  if (p.purchaseLocation) parts.push(p.purchaseLocation);
  return parts.join(' ');
}
function nameWithCommon(p){ return p.commonName ? p.name+' （'+p.commonName+'）' : p.name; }
function titleLineText(p){ return [p.genus, nameWithCommon(p)].filter(Boolean).join(' '); }
function genusText(p){ return p.genus || ''; }
function plantById(id){ return plants.find(x=>x.id===id); }
function childrenOf(id){ return plants.filter(p=>p.parentId===id); }
function sortJa(arr){ return arr.slice().sort((a,b)=>a.localeCompare(b,'ja')); }
function sortedTags(p){ return sortJa(p.hashtags||[]); }
function usedPurchaseLocations(){ const s=new Set(); plants.forEach(p=>{ if(p.purchaseLocation) s.add(p.purchaseLocation); }); return Array.from(s); }
function usedEventInfos(){ const s=new Set(); plants.forEach(p=>{ if(p.eventInfo) s.add(p.eventInfo); }); return Array.from(s); }
function usedSpeciesNames(){ const s=new Set(); plants.forEach(p=>{ if(p.name) s.add(p.name); }); return Array.from(s); }
function usedCommonNames(){ const s=new Set(); plants.forEach(p=>{ if(p.commonName) s.add(p.commonName); }); return Array.from(s); }
function genusUsageCount(name){ return plants.filter(p=>p.genus===name).length; }

function eventsForMonth(year, month){
  const results = [];
  plants.forEach(p => {
    if (!p.eventInfo || !p.addedDate) return;
    const d = new Date(p.addedDate);
    if (d.getMonth() === month && d.getFullYear() < year) results.push({ p, date: d });
  });
  return results.sort((a,b) => a.date.getDate() - b.date.getDate());
}

function hashHue(str){ let h=0; for(let i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))%360; } return h; }
function tagColor(t){ const hue=hashHue(t); return { bg:'hsl('+hue+', 65%, 93%)', fg:'hsl('+hue+', 55%, 32%)' }; }
function tagChipHtml(t, extra){ const c=tagColor(t); return '<span '+(extra||'')+' style="font-size:12px; background:'+c.bg+'; color:'+c.fg+'; padding:3px 8px; border-radius:10px; display:inline-block;">#'+escapeHtml(t)+'</span>'; }

// Genus code is simply its first letter (collisions between genera are fine —
// the species name in the number itself keeps things distinguishable enough).
function genusLetterCode(genus){
  const ch = (genus||'').trim().charAt(0).toUpperCase();
  return /[A-Z]/.test(ch) ? ch : 'X';
}
function formatManagementNumber(genus, speciesName, seq){
  const gCode = genusLetterCode(genus);
  return gCode+'.'+(speciesName||'')+'-'+pad(seq,3);
}
function genManagementNumber(genus, speciesName){
  const seq=plants.filter(p=>p.genus===genus).length+1;
  return formatManagementNumber(genus, speciesName, seq);
}
function rebuildListsFromPlants(){
  if (genusList.length === 0) {
    const seen = []; plants.forEach(p => { if (p.genus && !seen.includes(p.genus)) seen.push(p.genus); });
    genusList = seen;
  }
}
function renumberAll(){
  const counts = {};
  plants.forEach(p => {
    counts[p.genus] = (counts[p.genus]||0)+1;
    p.managementNumber = formatManagementNumber(p.genus, p.name, counts[p.genus]);
  });
}

function allTags(){ const s=new Set(); plants.forEach(p=>(p.hashtags||[]).forEach(t=>s.add(t))); return Array.from(s); }
function usedGenera(){ const s=new Set(); plants.forEach(p=>{ if(p.genus) s.add(p.genus); }); return Array.from(s); }
function matchesQuery(p,q){
  if(!q) return true;
  const needle=q.toLowerCase().replace(/^#/,'');
  if(p.name.toLowerCase().includes(needle)) return true;
  if((p.commonName||'').toLowerCase().includes(needle)) return true;
  if((p.genus||'').toLowerCase().includes(needle)) return true;
  if((p.managementNumber||'').toLowerCase().includes(needle)) return true;
  if((p.purchaseLocation||'').toLowerCase().includes(needle)) return true;
  if((p.eventInfo||'').toLowerCase().includes(needle)) return true;
  if((p.hashtags||[]).some(t=>t.toLowerCase().includes(needle))) return true;
  return false;
}
function sortPlants(arr){
  const a = arr.slice();
  if (view.sortBy === 'addedDate') return a.sort((x,y)=> {
    if(!x.addedDate && !y.addedDate) return 0;
    if(!x.addedDate) return 1;
    if(!y.addedDate) return -1;
    return new Date(y.addedDate)-new Date(x.addedDate);
  });
  if (view.sortBy === 'lastLog') return a.sort((x,y)=> new Date(latestLogDate(y)||0)-new Date(latestLogDate(x)||0));
  return a.sort((x,y)=>x.name.localeCompare(y.name,'ja'));
}

function logsOnDate(dateStr){
  const out = [];
  plants.forEach(p => (p.logs||[]).forEach(l => { if (l.date === dateStr) out.push({ p, l }); }));
  return out;
}
function acquiredOnDate(dateStr){
  return plants.filter(p => p.addedDate === dateStr);
}
function datesWithLogsInMonth(year, month){
  const s = new Set();
  plants.forEach(p => (p.logs||[]).forEach(l => {
    const d = new Date(l.date);
    if (d.getFullYear()===year && d.getMonth()===month) s.add(l.date);
  }));
  return s;
}
function datesAcquiredInMonth(year, month){
  const s = new Set();
  plants.forEach(p => { if (p.addedDate) { const d = new Date(p.addedDate); if (d.getFullYear()===year && d.getMonth()===month) s.add(p.addedDate); } });
  return s;
}
function monthSummary(year, month){
  let newCount = 0, logCount = 0;
  plants.forEach(p => {
    if (p.addedDate) { const d = new Date(p.addedDate); if (d.getFullYear()===year && d.getMonth()===month) newCount++; }
    (p.logs||[]).forEach(l => { const d = new Date(l.date); if (d.getFullYear()===year && d.getMonth()===month) logCount++; });
  });
  return { newCount, logCount };
}

function render() {
  const app = document.getElementById('app');
  stopScan();
  if (window.__pbStop) { window.__pbStop(); window.__pbStop = null; }
  if (view.screen === 'list') { app.innerHTML = renderList(); bindListEvents(); }
  else if (view.screen === 'add') { app.innerHTML = renderForm(null); bindFormEvents(null); }
  else if (view.screen === 'edit') { app.innerHTML = renderForm(view.plantId); bindFormEvents(view.plantId); }
  else if (view.screen === 'detail') { app.innerHTML = renderDetail(view.plantId); bindDetailEvents(); }
  else if (view.screen === 'logAdd') { app.innerHTML = renderLogForm(view.plantId); bindLogEvents(); }
  else if (view.screen === 'scan') { app.innerHTML = renderScan(); bindScanEvents(); }
  else if (view.screen === 'calendar') { app.innerHTML = renderCalendar(); bindCalendarEvents(); }
  else if (view.screen === 'taxonomy') { app.innerHTML = renderTaxonomyManage(); bindTaxonomyEvents(); }
  else if (view.screen === 'backup') { app.innerHTML = renderBackup(); bindBackupEvents(); }
  else if (view.screen === 'help') { app.innerHTML = renderHelp(); bindHelpEvents(); }
}

function pillBtn(key, label, active) {
  return '<button class="mode-btn app-btn" data-key="'+escapeHtml(key)+'" style="flex-shrink:0; height:30px; padding:0 13px; font-size:13px; white-space:nowrap; ' +
    (active ? 'background:var(--bg-success); color:var(--text-success); border:0.5px solid var(--border-success);' : '') + '">'+escapeHtml(label)+'</button>';
}

function sectionToggleHtml(id, iconClass, label, count, isOpen) {
  return '<button class="app-btn" id="'+id+'" style="width:100%; height:48px; padding:0 1rem; background:transparent; border:none; display:flex; align-items:center; justify-content:space-between; font-size:14px; font-weight:500;">' +
    '<span style="display:flex; align-items:center; gap:8px;"><i class="ti '+iconClass+'" style="font-size:17px;" aria-hidden="true"></i>'+label+(count!=null?' <span style="font-weight:400; color:var(--text-muted); font-size:12px;">('+count+')</span>':'')+'</span>' +
    '<i class="ti ti-chevron-down" style="font-size:16px; color:var(--text-muted); transform:rotate('+(isOpen?'180':'0')+'deg); transition:transform 0.15s;" aria-hidden="true"></i>' +
    '</button>';
}

function plantCard(p) {
  const thumb = (p.photos && p.photos[0]) ? p.photos[0] : null;
  let html = '<div class="plant-card app-card" data-id="'+p.id+'" style="background:var(--surface-2); border:0.5px solid var(--border); padding:0.75rem 1rem; display:flex; align-items:center; gap:12px; cursor:pointer; min-width:0;">';
  if (thumb) html += '<img src="'+thumb+'" style="width:46px; height:46px; border-radius:12px; object-fit:cover; flex-shrink:0; align-self:flex-start;" />';
  else html += '<div style="width:46px; height:46px; border-radius:12px; background:var(--bg-success); display:flex; align-items:center; justify-content:center; flex-shrink:0; align-self:flex-start;"><i class="ti ti-plant" style="font-size:20px; color:var(--text-success);" aria-hidden="true"></i></div>';
  html += '<div style="flex:1; min-width:0;">';
  html += '<p style="font-weight:500; font-size:15px; margin:0; overflow-wrap:break-word;">'+escapeHtml(genusText(p))+'<br>'+escapeHtml(nameWithCommon(p))+'</p>';
  const purchaseLine = purchaseLineText(p);
  html += '<p style="font-size:12px; color:var(--text-secondary); margin:2px 0 0; overflow-wrap:break-word;">'+escapeHtml(p.managementNumber)+'</p>';
  if (purchaseLine) html += '<p style="font-size:12px; color:var(--text-secondary); margin:2px 0 0; overflow-wrap:break-word;">'+escapeHtml(purchaseLine)+'</p>';
  if ((p.hashtags||[]).length) html += '<p style="margin:5px 0 0; display:flex; gap:4px; flex-wrap:wrap;">'+sortedTags(p).map(t=>tagChipHtml(t)).join('')+'</p>';
  html += '</div><i class="ti ti-chevron-right" style="font-size:17px; color:var(--text-muted); flex-shrink:0;" aria-hidden="true"></i></div>';
  return html;
}

// Camera-roll style photo carousel: a fixed set of slots (offsets -3..3 from the
// center) mapped circularly onto the browsable list, so it wraps infinitely in both
// directions. The track div (#pb-track) is dragged as one rigid block in bindListEvents;
// on release the drag distance is converted into a step count and this is re-rendered.
const PHOTO_BROWSE_SPACING = 34;
function photoBrowseHtml(list, centerIdx) {
  const n = list.length;
  let html = '<p style="font-size:12px; color:var(--text-secondary); margin:0 0 10px;">写真から探す</p>';
  html += '<div id="pb-wrap" style="position:relative; height:114px; overflow:hidden; margin:0 0 6px; touch-action:pan-y; cursor:grab;">';
  html += '<div id="pb-track" style="position:relative; width:100%; height:100%;">';
  list.forEach((p, idx) => {
    html += '<div class="pb-card" data-idx="'+idx+'" style="position:absolute; left:50%; top:50%; border-radius:14px; overflow:hidden; opacity:0; cursor:pointer;">';
    html += '<img src="'+p.photos[0]+'" style="width:100%; height:100%; object-fit:cover; display:block; pointer-events:none;" />';
    html += '</div>';
  });
  html += '</div></div>';
  const center = list[centerIdx];
  html += '<p id="pb-name" style="font-size:13px; font-weight:500; text-align:center; margin:0 0 16px; overflow-wrap:break-word;">'+escapeHtml(genusText(center))+' '+escapeHtml(center.name)+'</p>';
  return html;
}

function emptyState(msg) {

    '<i class="ti ti-seeding" style="font-size:32px; display:block; margin-bottom:12px; color:var(--text-muted);" aria-hidden="true"></i>' +

function groupHeaderHtml(key, labelHtml, count, bg, fg, isOpen) {

    '<span style="font-size:13px; font-weight:600; color:'+fg+';">'+labelHtml+' <span style="font-weight:400; opacity:0.75;">('+count+')</span></span>' +
    '<i class="ti ti-chevron-down" style="font-size:15px; color:'+fg+'; transform:rotate('+(isOpen?'180':'0')+'deg); transition:transform 0.15s;" aria-hidden="true"></i>' +
    '</button>';

function renderList() {
  let html = '';
  html += '<div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:0.85rem;">';
  html += '<h3 style="margin:0; font-size:19px; font-weight:600;">植物図鑑</h3>';
  html += '<div style="display:flex; gap:6px;">';
  html += '<button class="app-btn" id="cal-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-calendar" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button class="app-btn" id="scan-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-qrcode" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button class="app-btn" id="taxonomy-manage-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-settings" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button class="app-btn" id="backup-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center;"><i class="ti ti-cloud" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<button class="app-btn" id="add-btn" style="display:flex; align-items:center; gap:6px; padding:0 14px; height:36px; background:var(--fill-primary); color:var(--on-primary); border:none;"><i class="ti ti-plus" style="font-size:18px;" aria-hidden="true"></i>追加</button>';
  html += '</div></div>';

  html += '<div style="position:relative; margin-bottom:0.6rem;">';
  html += '<i class="ti ti-search" style="position:absolute; left:10px; top:50%; transform:translateY(-50%); font-size:16px; color:var(--text-muted);" aria-hidden="true"></i>';
  html += '<input id="search-input" type="text" placeholder="検索" value="'+escapeHtml(view.query)+'" class="app-input" style="width:100%; padding-left:34px;" />';
  html += '</div>';

  html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:6px; margin-bottom:0.75rem;">';
  html += '<div style="display:flex; gap:6px; overflow-x:auto;">';
  html += pillBtn('all', 'すべて', view.mode === 'all');
  html += pillBtn('tag', 'タグ別', view.mode === 'tag');
  html += pillBtn('genus', '属別', view.mode === 'genus');
  html += '</div>';
  html += '<select id="sort-select" class="app-select" style="height:30px; font-size:12px; padding:0 6px; width:auto; flex-shrink:0; color:var(--text-secondary);">';
  html += '<option value="name" '+(view.sortBy==='name'?'selected':'')+'>名前順</option>';
  html += '<option value="addedDate" '+(view.sortBy==='addedDate'?'selected':'')+'>お迎え日順</option>';
  html += '<option value="lastLog" '+(view.sortBy==='lastLog'?'selected':'')+'>記録順</option>';
  html += '</select>';
  html += '</div>';

  const q = view.query.trim();

  if (view.mode === 'all') {
    const filtered = sortPlants(plants.filter(p => matchesQuery(p, q)));
    if (filtered.length === 0) html += emptyState('該当する植物がありません');
    else {
      const browsable = filtered.filter(p => p.photos && p.photos[0]);
      if (!q && browsable.length > 3) {
        if (photoBrowseIndex >= browsable.length) photoBrowseIndex = 0;
        window.__photoBrowseList = browsable;
        html += photoBrowseHtml(browsable, photoBrowseIndex);
      }
      html += '<div style="display:flex; flex-direction:column; gap:10px;">';
      filtered.forEach(p => { html += plantCard(p); });
      html += '</div>';
    }
  } else if (view.mode === 'tag') {
    const tags = sortJa(allTags()); let any = false;
    tags.forEach(t => {
      const group = sortPlants(plants.filter(p => (p.hashtags||[]).includes(t) && matchesQuery(p, q)));
      if (group.length === 0) return; any = true;
      const c = tagColor(t);
      const key = 'tag:'+t;
      const isOpen = expandedGroups.has(key);
      html += groupHeaderHtml(key, '#'+escapeHtml(t), group.length, c.bg, c.fg, isOpen);
      if (isOpen) { html += '<div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">'; group.forEach(p => { html += plantCard(p); }); html += '</div>'; }
    });
    if (!any) html += emptyState('該当する植物がありません');
  } else if (view.mode === 'genus') {
    const genera = sortJa(usedGenera()); let any = false;
    genera.forEach(g => {
      const group = sortPlants(plants.filter(p => p.genus === g && matchesQuery(p, q)));
      if (group.length === 0) return; any = true;
      const key = 'genus:'+g;
      const isOpen = expandedGroups.has(key);
      html += groupHeaderHtml(key, escapeHtml(g), group.length, 'var(--bg-accent-muted)', 'var(--text-accent)', isOpen);
      if (isOpen) { html += '<div style="display:flex; flex-direction:column; gap:10px; margin-top:8px;">'; group.forEach(p => { html += plantCard(p); }); html += '</div>'; }
    });
    if (!any) html += emptyState('該当する植物がありません');
  }

  return html;
}

function bindPhotoBrowseEvents() {
  const wrap = document.getElementById('pb-wrap');
  const track = document.getElementById('pb-track');
  const nameEl = document.getElementById('pb-name');
  const cards = Array.from(document.querySelectorAll('.pb-card'));
  if (!wrap || !track || cards.length === 0) return;
  const list = window.__photoBrowseList || [];
  const n = cards.length;

  // Stop any previous instance's animation loop (e.g. from before this re-render).
  if (window.__pbStop) window.__pbStop();

  let centerPos = Math.min(photoBrowseIndex, n - 1);
  let target = centerPos;
  let dragging = false, flinging = false, moved = false, stopped = false;
  let velocity = 0; // index-units per ms
  let startX = 0, startPos = 0;
  let samples = [];
  let lastT = performance.now();
  let rafId = null;

  function circDist(i, pos) { let d = i - pos; d = d - Math.round(d / n) * n; return d; }

  function layout() {
    cards.forEach((el, i) => {
      const dist = circDist(i, centerPos);
      const ad = Math.abs(dist);
      if (ad > 3.6) { el.style.opacity = '0'; return; }
      const size = Math.max(34, 82 - ad * 15);
      const h = size * 1.35;
      el.style.width = size + 'px';
      el.style.height = h + 'px';
      el.style.marginLeft = (-size / 2) + 'px';
      el.style.marginTop = (-h / 2) + 'px';
      el.style.opacity = String(Math.max(0, 1 - ad * 0.28));
      el.style.zIndex = String(Math.round(100 - ad * 10));
      el.style.boxShadow = ad < 0.3 ? 'var(--shadow-md)' : 'none';
      el.style.border = ad < 0.3 ? '2px solid var(--border-accent)' : 'none';
      el.style.transform = 'translateX(' + (dist * PHOTO_BROWSE_SPACING) + 'px)';
    });
    const rounded = ((Math.round(centerPos) % n) + n) % n;
    const p = list[rounded];
    if (p && nameEl) nameEl.textContent = genusText(p) + ' ' + p.name;
  }

  function animate(now) {
    if (stopped) return;
    const dt = Math.min(48, now - lastT);
    lastT = now;
    if (dragging) {
      // held in place by onMove while the finger is down
    } else if (flinging) {
      centerPos += velocity * dt;
      velocity *= Math.pow(0.12, dt / 1000); // gentle decay so a flick keeps flowing
      if (Math.abs(velocity) < 0.0006) { flinging = false; target = Math.round(centerPos); }
    } else {
      const diff = target - centerPos;
      const d = diff - Math.round(diff / n) * n;
      centerPos += d * (1 - Math.pow(0.0008, dt / 1000));
      if (Math.abs(d) < 0.0015) centerPos = target;
    }
    layout();
    photoBrowseIndex = ((Math.round(centerPos) % n) + n) % n;
    rafId = requestAnimationFrame(animate);
  }

  function onDown(clientX) {
    dragging = true; flinging = false; moved = false; velocity = 0;
    startX = clientX; startPos = centerPos;
    samples = [{ x: clientX, t: performance.now() }];
    wrap.style.cursor = 'grabbing';
  }
  function onMove(clientX) {
    if (!dragging) return;
    const dx = clientX - startX;
    if (Math.abs(dx) > 4) moved = true;
    centerPos = startPos - dx / PHOTO_BROWSE_SPACING;
    samples.push({ x: clientX, t: performance.now() });
    if (samples.length > 6) samples.shift();
  }
  function onUpEnd() {
    if (!dragging) return;
    dragging = false;
    wrap.style.cursor = 'grab';
    let v = 0;
    if (samples.length >= 2) {
      const last = samples[samples.length - 1];
      const ref = samples.find(s => last.t - s.t <= 80) || samples[0];
      const dt = last.t - ref.t;
      if (dt > 0) v = (last.x - ref.x) / dt; // px/ms
    }
    const idxVelocity = -v / PHOTO_BROWSE_SPACING;
    if (Math.abs(idxVelocity) > 0.01) { flinging = true; velocity = idxVelocity; }
    else { flinging = false; target = Math.round(centerPos); }
  }

  wrap.onpointerdown = (e) => onDown(e.clientX);
  wrap.onpointermove = (e) => onMove(e.clientX);
  wrap.onpointerup = onUpEnd;
  wrap.onpointerleave = () => { if (dragging) onUpEnd(); };

  cards.forEach(el => {
    el.onclick = () => {
      if (moved) return;
      const idx = Number(el.dataset.idx);
      const off = Math.round(circDist(idx, centerPos));
      if (off === 0) {
        const p = list[idx];
        if (p) { stopped = true; if (rafId) cancelAnimationFrame(rafId); view = { screen:'detail', plantId: p.id, mode: view.mode, query: view.query, sortBy: view.sortBy }; render(); }
      } else {
        flinging = false;
        target = idx;
      }
    };
  });

  window.__pbStop = () => { stopped = true; if (rafId) cancelAnimationFrame(rafId); };

  layout();
  rafId = requestAnimationFrame(animate);
}

function renderTaxonomyManage() {
  let html = '';
  html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:1rem;">';
  html += '<button class="app-btn" id="back-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-arrow-left" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<h3 style="margin:0; font-size:19px; font-weight:600;">属の管理</h3></div>';

  html += '<button class="app-btn" id="help-btn" style="width:100%; height:38px; font-size:13px; margin-bottom:1.25rem; display:flex; align-items:center; justify-content:center; gap:6px;"><i class="ti ti-help-circle" style="font-size:16px;" aria-hidden="true"></i>使い方(管理番号・ラベル・記録・バックアップ)</button>';

  html += '<p style="font-size:12px; color:var(--text-muted); margin:0 0 1.25rem; line-height:1.6;">誤字などは「編集」で直せます(同じ番号のまま名前だけ変わります)。削除は使われていない項目のみ可能です。</p>';

  html += '<div class="app-card" style="background:var(--surface-1); padding:10px 12px; margin-bottom:1.5rem;">';
  html += '<p style="margin:0 0 8px; font-size:12px; color:var(--text-muted); line-height:1.6;">属の名前を編集した場合など、管理番号を今の状態に合わせて振り直せます(全株の番号が変わる可能性があります)。</p>';
  html += '<button class="app-btn" id="taxonomy-reset-numbers-btn" style="width:100%; height:36px; font-size:12px;">管理番号を振り直す</button>';
  html += '</div>';

  function rowsHtml(list, kind, usageFn) {
    let h = '<div style="display:flex; flex-direction:column; gap:8px; margin-bottom:1.5rem;">';
    const items = list.map((name,i)=>({name,i})).filter(x=>x.name);
    const sorted = sortJa(items.map(x=>x.name)).map(name => items.find(x=>x.name===name));
    if (sorted.length === 0) h += '<p style="font-size:13px; color:var(--text-muted); text-align:center; padding:1rem 0;">登録がありません</p>';
    sorted.forEach(({name,i}) => {
      const count = usageFn(name);
      const isEditing = taxonomyEditing && taxonomyEditing.kind === kind && taxonomyEditing.i === i;
      const isConfirmingDelete = taxonomyDeleteConfirm && taxonomyDeleteConfirm.kind === kind && taxonomyDeleteConfirm.i === i;
      h += '<div class="app-card" style="background:var(--surface-2); border:0.5px solid var(--border); padding:10px 12px;">';
      if (isEditing) {
        h += '<div style="display:flex; align-items:center; gap:8px;">';
        h += '<input class="taxonomy-edit-input app-input" data-kind="'+kind+'" data-i="'+i+'" type="text" value="'+escapeHtml(name)+'" style="flex:1;" />';
        h += '<button class="app-btn taxonomy-edit-save" data-kind="'+kind+'" data-i="'+i+'" style="height:32px; padding:0 10px; font-size:12px; flex-shrink:0;">保存</button>';
        h += '<button class="app-btn taxonomy-edit-cancel" style="height:32px; padding:0 10px; font-size:12px; flex-shrink:0;">取消</button>';
        h += '</div>';
        if (taxonomyEditError && taxonomyEditError.kind===kind && taxonomyEditError.i===i) {
          h += '<p style="margin:6px 0 0; font-size:12px; color:var(--text-danger);">'+escapeHtml(taxonomyEditError.message)+'</p>';
        }
      } else if (isConfirmingDelete) {
        h += '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px;">';
        h += '<span style="font-size:12px; color:var(--text-danger); flex:1;">「'+escapeHtml(name)+'」を削除しますか?</span>';
        h += '<button class="app-btn taxonomy-delete-confirm" data-kind="'+kind+'" data-i="'+i+'" style="height:30px; padding:0 12px; font-size:12px; background:var(--fill-danger); color:var(--on-danger); border:none; flex-shrink:0;">削除する</button>';
        h += '<button class="app-btn taxonomy-delete-cancel" style="height:30px; padding:0 12px; font-size:12px; flex-shrink:0;">キャンセル</button>';
        h += '</div>';
      } else {
        h += '<div style="display:flex; align-items:center; gap:8px;">';
        h += '<span style="font-size:13px; overflow-wrap:break-word; flex:1;">'+escapeHtml(name)+'</span>';
        if (count > 0) h += '<span style="font-size:11px; color:var(--text-muted); flex-shrink:0;">使用中('+count+')</span>';
        h += '<button class="app-btn taxonomy-edit-btn" data-kind="'+kind+'" data-i="'+i+'" style="height:26px; padding:0 10px; font-size:12px; flex-shrink:0;">編集</button>';
        if (count === 0) h += '<button class="app-btn taxonomy-delete-btn" data-kind="'+kind+'" data-i="'+i+'" style="height:26px; padding:0 10px; font-size:12px; color:var(--text-danger); flex-shrink:0;">削除</button>';
        h += '</div>';
      }
      h += '</div>';
    });
    h += '</div>';
    return h;
  }

  html += rowsHtml(genusList, 'genus', genusUsageCount);

  return html;
}

function bindTaxonomyEvents() {
  document.getElementById('back-btn').onclick = () => { taxonomyEditing = null; taxonomyDeleteConfirm = null; taxonomyEditError = null; view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };

  document.getElementById('help-btn').onclick = () => { view = { screen:'help', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };

  document.getElementById('taxonomy-reset-numbers-btn').onclick = async () => {
    if (!window.confirm('全ての株の管理番号を、今の属の名前に合わせて振り直します。すでに印刷したラベルの番号と合わなくなる場合があります。よろしいですか？')) return;
    genusList = genusList.filter(Boolean);
    renumberAll();
    await saveGenusList(); await savePlants();
    render();
  };

  document.querySelectorAll('.taxonomy-edit-btn').forEach(btn => {
    btn.onclick = () => { taxonomyDeleteConfirm = null; taxonomyEditError = null; taxonomyEditing = { kind: btn.dataset.kind, i: Number(btn.dataset.i) }; render(); };
  });
  document.querySelectorAll('.taxonomy-edit-cancel').forEach(btn => {
    btn.onclick = () => { taxonomyEditing = null; taxonomyEditError = null; render(); };
  });
  document.querySelectorAll('.taxonomy-edit-save').forEach(btn => {
    btn.onclick = async () => {
      const kind = btn.dataset.kind;
      const i = Number(btn.dataset.i);
      const input = document.querySelector('.taxonomy-edit-input[data-kind="'+kind+'"][data-i="'+i+'"]');
      const newName = input.value.trim();
      if (!newName) return;
      const list = genusList;
      const oldName = list[i];
      if (newName === oldName) { taxonomyEditing = null; taxonomyEditError = null; render(); return; }
      const dup = list.some((n, idx) => idx !== i && n === newName);
      if (dup) { taxonomyEditError = { kind, i, message: '「'+newName+'」は既に登録されています' }; render(); return; }
      list[i] = newName;
      await saveGenusList();
      plants.forEach(p => { if (p.genus === oldName) p.genus = newName; });
      renumberAll();
      await savePlants();
      taxonomyEditing = null;
      taxonomyEditError = null;
      render();
    };
  });

  document.querySelectorAll('.taxonomy-delete-btn').forEach(btn => {
    btn.onclick = () => { taxonomyEditing = null; taxonomyDeleteConfirm = { kind: btn.dataset.kind, i: Number(btn.dataset.i) }; render(); };
  });
  document.querySelectorAll('.taxonomy-delete-cancel').forEach(btn => {
    btn.onclick = () => { taxonomyDeleteConfirm = null; render(); };
  });
  document.querySelectorAll('.taxonomy-delete-confirm').forEach(btn => {
    btn.onclick = async () => {
      const i = Number(btn.dataset.i);
      genusList[i] = null; await saveGenusList();
      taxonomyDeleteConfirm = null;
      render();
    };
  });
}

  html += '</div>';
  html += '<p id="scan-status" style="text-align:center; font-size:13px; color:var(--text-muted); margin-top:12px;">ラベルのQRコードを枠内に映してください</p>';

function stopScan() {
  if (scanRAF) { cancelAnimationFrame(scanRAF); scanRAF = null; }
  if (scanStream) { scanStream.getTracks().forEach(t => t.stop()); scanStream = null; }
}

function plantDeepLink(p) {
  const base = location.href.split('#')[0];
  return base + '#p=' + encodeURIComponent(p.id);
}
function findPlantFromScanText(text) {
  const hashMatch = text.match(/[#?&]p=([A-Za-z0-9_-]+)/);
  if (hashMatch) { const found = plants.find(p => p.id === decodeURIComponent(hashMatch[1])); if (found) return found; }
  const idMatch = text.match(/ID:([A-Za-z0-9]+)/);
  if (idMatch) { const found = plants.find(p => p.id === idMatch[1]); if (found) return found; }
  return plants.find(p => text.includes(p.managementNumber)) || null;
}

async function bindScanEvents() {
  document.getElementById('back-btn').onclick = () => { view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  const video = document.getElementById('scan-video');
  const statusEl = document.getElementById('scan-status');
  try {
    scanStream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
    video.srcObject = scanStream;
    await video.play();
    const canvas = document.createElement('canvas');
    const ctx = canvas.getContext('2d');
    const tick = () => {
      if (video.readyState === video.HAVE_ENOUGH_DATA) {
        canvas.width = video.videoWidth; canvas.height = video.videoHeight;
        ctx.drawImage(video, 0, 0, canvas.width, canvas.height);
        const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
        const code = jsQR(imgData.data, imgData.width, imgData.height);
        if (code && code.data) {
          const found = findPlantFromScanText(code.data);
          if (found) {
            stopScan();
            view = { screen:'detail', plantId: found.id, mode:view.mode, query:view.query, sortBy:view.sortBy };
            render();
            return;
          } else {
            statusEl.textContent = '一致する植物が見つかりません';
          }
        }
      }
      scanRAF = requestAnimationFrame(tick);
    };
    scanRAF = requestAnimationFrame(tick);
  } catch (e) {
    statusEl.textContent = 'カメラを利用できません。ブラウザの設定でカメラへのアクセスを許可してください。';
  }
}

function bindCombo(id, list) {
  const input = document.getElementById(id);
  const dropdown = document.getElementById(id+'-dropdown');
  if (!input || !dropdown) return;
  function showMatches() {
    const val = input.value.trim().toLowerCase();
    const matches = val ? list.filter(v => v.toLowerCase().includes(val)) : list;
    if (matches.length === 0) { dropdown.style.display = 'none'; return; }
    dropdown.innerHTML = matches.slice(0, 30).map(v =>
      '<div class="combo-option" data-val="'+escapeHtml(v)+'" style="padding:10px 12px; font-size:14px; cursor:pointer; border-bottom:0.5px solid var(--border);">'+escapeHtml(v)+'</div>'
    ).join('');
    dropdown.style.display = 'block';

function resizeImage(file, maxW) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (e) => {
      const img = new Image();
      img.onload = () => {
        const scale = Math.min(1, maxW / img.width);
        const canvas = document.createElement('canvas');
        canvas.width = img.width * scale; canvas.height = img.height * scale;
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.75));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  html += sectionToggleHtml('taghistory-toggle-btn', 'ti-history', 'タグ履歴', removedTagsLog.length, tagHistoryExpanded);
  if (tagHistoryExpanded) {
    html += '<div style="padding:0 1rem 1.25rem;">';
    if (removedTagsLog.length === 0) html += '<p style="font-size:13px; color:var(--text-muted); text-align:center; padding:1.5rem 0;">外したタグの履歴はありません</p>';
    else {
      html += '<div style="display:flex; flex-direction:column; gap:6px;">';
      removedTagsLog.forEach((entry, i) => {
        html += '<div style="display:flex; align-items:center; justify-content:space-between; gap:8px; background:var(--surface-2); border-radius:10px; padding:8px 10px;">';
        html += '<span style="font-size:12px; color:var(--text-secondary);">#'+escapeHtml(entry.tag)+' を外しました</span>';
        html += '<button class="app-btn tag-restore-btn" data-i="'+i+'" style="height:26px; padding:0 10px; font-size:12px; flex-shrink:0;">戻す</button>';
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  }
  html += '</div>';

  return html;
}

function bindDetailEvents() {
  const p = plants.find(x=>x.id===view.plantId);
  document.getElementById('back-btn').onclick = () => { timelineViewerIndex = null; view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('edit-btn').onclick = () => { timelineViewerIndex = null; view = { screen:'edit', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  document.getElementById('del-btn').onclick = async () => {
    plants = plants.filter(x=>x.id!==p.id);
    plants.forEach(x => { if (x.parentId === p.id) x.parentId = null; });
    renumberAll(); await savePlants();
    view = { screen:'list', plantId:null, mode:view.mode, query:view.query, sortBy:view.sortBy }; render();
  };
  document.getElementById('log-add-btn').onclick = () => { pendingLogPhotos=[]; view = { screen:'logAdd', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };

  document.querySelectorAll('.timeline-thumb').forEach(el => {
    el.onclick = () => {
      const idx = Number(el.dataset.idx);
      timelineViewerIndex = (timelineViewerIndex === idx) ? null : idx;
      render();
    };
  });
  const timelineDetailClose = document.getElementById('timeline-detail-close');
  if (timelineDetailClose) {
    timelineDetailClose.onclick = () => { timelineViewerIndex = null; render(); };
    document.getElementById('timeline-detail-delete').onclick = async () => {
      if (!window.confirm('この成長記録を削除します。よろしいですか？')) return;
      const l = (window.__timelineItems||[])[timelineViewerIndex];
      if (l) p.logs = (p.logs||[]).filter(x => x.id !== l.id);
      timelineViewerIndex = null;
      await savePlants();
      render();
    };
  }

  document.getElementById('info-toggle-btn').onclick = () => { infoExpanded = !infoExpanded; render(); };
  document.getElementById('qr-toggle-btn').onclick = () => { qrExpanded = !qrExpanded; render(); };
  document.getElementById('logs-toggle-btn').onclick = () => { logsExpanded = !logsExpanded; render(); };
  document.getElementById('taghistory-toggle-btn').onclick = () => { tagHistoryExpanded = !tagHistoryExpanded; render(); };

  if (infoExpanded) {
    const parentLink = document.querySelector('.parent-link');
    if (parentLink) parentLink.onclick = () => { view = { screen:'detail', plantId: parentLink.dataset.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
    document.querySelectorAll('.child-link').forEach(el => { el.onclick = () => { view = { screen:'detail', plantId: el.dataset.id, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); }; });

    document.querySelectorAll('.tag-remove-detail').forEach(el => {
      el.onclick = async (e) => {
        e.stopPropagation();
        const t = el.dataset.tag;
        p.hashtags = (p.hashtags||[]).filter(x => x !== t);
        p.removedTagsLog = p.removedTagsLog || [];
        p.removedTagsLog.unshift({ tag: t });
        if (p.removedTagsLog.length > 5) p.removedTagsLog = p.removedTagsLog.slice(0, 5);
        await savePlants();
        tagHistoryExpanded = true;
        render();
      };
    });

    document.getElementById('tag-add-open-btn').onclick = () => { tagAddOpenFor = (tagAddOpenFor === p.id) ? null : p.id; render(); };
    if (tagAddOpenFor === p.id) {
      bindCombo('detail-tag-input', sortJa(allTags().filter(t => !(p.hashtags||[]).includes(t))));
      document.getElementById('detail-tag-add-btn').onclick = async () => {
        const input = document.getElementById('detail-tag-input');
        let v = input.value.trim().replace(/^#/, '');
        if (v) {
          p.hashtags = p.hashtags || [];
          if (!p.hashtags.includes(v)) { p.hashtags.push(v); await savePlants(); }
          tagAddOpenFor = null;
          render();
        }
      };
    }
  }

  if (tagHistoryExpanded) {
    document.querySelectorAll('.tag-restore-btn').forEach(btn => {
      btn.onclick = async () => {
        const i = Number(btn.dataset.i);
        const entry = (p.removedTagsLog||[])[i];
        if (entry) {
          p.hashtags = p.hashtags || [];
          if (!p.hashtags.includes(entry.tag)) p.hashtags.push(entry.tag);
          p.removedTagsLog.splice(i, 1);
          await savePlants();
          render();
        }
      };
    });
  }

  if (!qrExpanded) return;

  new QRCode(document.getElementById('qr-code'), { text: plantDeepLink(p), width: 120, height: 120 });

  document.getElementById('label-download-btn').onclick = () => {
    const scale = 10; // px per mm
    const totalWidthMm = 50;
    const totalHeightMm = 12;
    const qrSizeMm = 10;
    const padMm = 2;
    const gapMm = 2;

    const canvas = document.createElement('canvas');
    canvas.width = totalWidthMm * scale;
    canvas.height = totalHeightMm * scale;
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.textBaseline = 'middle';
    ctx.textAlign = 'left';

    const qrSize = qrSizeMm * scale;
    const padX = padMm * scale;
    const gap = gapMm * scale;
    const textAreaStart = padX + qrSize + gap;
    const textAreaWidth = canvas.width - textAreaStart - padX;

    function truncateToFit(text, maxWidth) {
      if (!text) return '';
      if (ctx.measureText(text).width <= maxWidth) return text;
      let t = text;
      while (t.length > 1 && ctx.measureText(t + '…').width > maxWidth) t = t.slice(0, -1);
      return t + '…';
    }

    const labelFont = "700 36px 'Yu Gothic', 'YuGothic', '游ゴシック体', '游ゴシック', sans-serif";
    const labelFont2 = "700 22px 'Yu Gothic', 'YuGothic', '游ゴシック体', '游ゴシック', sans-serif";
    ctx.font = labelFont;
    const cgText = truncateToFit(p.managementNumber || '', textAreaWidth);
    const dateLoc = [p.addedDate ? fmtDate(p.addedDate) : '', p.purchaseLocation || ''].filter(Boolean).join(' ');
    ctx.font = labelFont2;
    const nameText = truncateToFit(dateLoc, textAreaWidth);

    // Generate a separate black QR code on transparent background for the printed label
    // (this "white ink on clear tape" printer app expects black design and converts it to white ink automatically)
    const qrTemp = document.createElement('div');
    qrTemp.style.position = 'fixed';
    qrTemp.style.left = '-9999px';
    document.body.appendChild(qrTemp);
    new QRCode(qrTemp, { text: plantDeepLink(p), width: qrSize, height: qrSize, colorDark: '#000000', colorLight: 'rgba(0,0,0,0)' });

    const draw = () => {
      const qrImg = qrTemp.querySelector('img') || qrTemp.querySelector('canvas');
      ctx.drawImage(qrImg, padX, (canvas.height-qrSize)/2, qrSize, qrSize);

      // Line 1 (management number) is larger than line 2 (date/location)
      const lineHeight1 = 38;
      const lineHeight2 = 26;
      const lineGap = 6;
      const blockHeight = lineHeight1 + lineGap + lineHeight2;
      const blockStartY = (canvas.height - blockHeight) / 2 + lineHeight1 / 2;
      const line2Y = blockStartY + lineHeight1 / 2 + lineGap + lineHeight2 / 2;

      ctx.fillStyle = '#000000';
      ctx.font = labelFont;
      ctx.fillText(cgText, textAreaStart, blockStartY);
      ctx.font = labelFont2;
      ctx.fillText(nameText, textAreaStart, line2Y);

      document.body.removeChild(qrTemp);
      canvas.toBlob((blob) => { const url = URL.createObjectURL(blob); const a = document.createElement('a'); a.href = url; a.download = 'label_'+p.managementNumber+'.png'; a.click(); URL.revokeObjectURL(url); });
    };
    const qrImgCheck = qrTemp.querySelector('img');
    if (qrImgCheck && !qrImgCheck.complete) { qrImgCheck.onload = draw; } else { setTimeout(draw, 30); }
  };
}

function renderLogForm(plantId) {
  const p = plants.find(x=>x.id===plantId);
  let html = '';
  html += '<div style="display:flex; align-items:center; gap:10px; margin-bottom:1.25rem;">';
  html += '<button class="app-btn" id="back-btn" style="width:36px; height:36px; padding:0; display:flex; align-items:center; justify-content:center; flex-shrink:0;"><i class="ti ti-arrow-left" style="font-size:18px;" aria-hidden="true"></i></button>';
  html += '<h3 style="margin:0; font-size:19px; font-weight:600; flex:1; min-width:0; overflow-wrap:break-word;">'+escapeHtml(p?p.name:'')+' の記録</h3></div>';
  html += '<label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">写真</label>';
  html += renderPhotoPicker(pendingLogPhotos, 'log-');
  html += '<label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">記録日</label>';
  html += '<input id="l-date" type="date" value="'+new Date().toISOString().slice(0,10)+'" class="app-input" style="width:100%; margin-bottom:1rem;" />';
  html += '<label style="font-size:13px; color:var(--text-secondary); display:block; margin-bottom:6px;">メモ</label>';
  html += '<textarea id="l-note" rows="3" class="app-input" style="width:100%; margin-bottom:1.25rem; padding:10px; font-family:var(--font-sans); font-size:14px;"></textarea>';
  html += '<p id="l-error" style="display:none; color:var(--text-danger); font-size:13px; margin:0 0 12px;"></p>';
  html += '<button class="app-btn" id="l-save-btn" style="width:100%; height:44px; background:var(--fill-primary); color:var(--on-primary); border:none; font-weight:600;">記録を保存</button>';
  return html;
}
function bindLogEvents() {
  document.getElementById('back-btn').onclick = () => { view = { screen:'detail', plantId:view.plantId, mode:view.mode, query:view.query, sortBy:view.sortBy }; render(); };
  bindPhotoPicker(pendingLogPhotos, 'log-', refreshLogPhotoGrid);
  document.getElementById('l-save-btn').onclick = async () => {
    const errEl = document.getElementById('l-error');
    const note = document.getElementById('l-note').value.trim();
    if (!note && pendingLogPhotos.length === 0) { errEl.textContent='写真かメモのどちらかを入力してください'; errEl.style.display='block'; return; }
    errEl.style.display = 'none';
    const p = plants.find(x=>x.id===view.plantId);
    if (!p.logs) p.logs = [];
    const date = document.getElementById('l-date').value || new Date().toISOString().slice(0,10);
    p.logs.push({ id: uid(), date, note, photos: pendingLogPhotos.slice() });
    await savePlants();
    view = { screen:'detail', plantId:p.id, mode:view.mode, query:view.query, sortBy:view.sortBy };
    render();
  };
}
